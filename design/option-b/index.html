<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Option B · The rack</title>
<style>
/* The sorting-frame world, shared by all three layout options.
   Shell = enamelled frame green; slots = pale steel-grey card; designators on brass label plates;
   vermilion exists ONLY on the needs-you tab and the answer surfaces (colour quarantine). */
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --frame: #1f4a44;
  --frame-2: #2a5d56;
  --frame-ink: #eaf2ee;
  --frame-ink-2: #b5cbc4;
  --ground: #e6eae4;
  --slot: #f7f8f4;
  --slot-2: #eef1ec;
  --ink: #161c1a;
  --ink-2: #4a5652;
  --ink-3: #66726e;
  --rule: #c9d1cb;
  --rule-strong: #9eaaa4;
  --brass: #c9a452;
  --brass-ink: #1f1a0e;
  --tab: #c93a22;
  --tab-ink: #ffffff;
  --tab-wash: #fbe9e4;
  --work: #2f7d6e;
  --focus: #2f7d6e;
  --term-bg: #12191a;
  --term-ink: #d7e2dc;
  --shadow: 0 6px 18px -8px rgb(22 28 26 / 0.35);
  --ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --label: 'Courier Prime', ui-monospace, monospace;
  --code: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: light;
}
:root[data-theme='dark'] {
  --frame: #0e2421;
  --frame-2: #173632;
  --frame-ink: #e3eeea;
  --frame-ink-2: #8fa9a1;
  --ground: #0f1514;
  --slot: #172120;
  --slot-2: #1d2927;
  --ink: #e7eeea;
  --ink-2: #a3b3ad;
  --ink-3: #82938d;
  --rule: #2a3734;
  --rule-strong: #43534f;
  --brass: #b8954a;
  --brass-ink: #17130a;
  --tab: #f0573b;
  --tab-ink: #1a0905;
  --tab-wash: #3a1c16;
  --work: #5fc2ae;
  --focus: #5fc2ae;
  --term-bg: #0a0f0f;
  --shadow: 0 8px 22px -10px rgb(0 0 0 / 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.4 var(--ui);
  color: var(--ink);
  background: var(--ground);
  -webkit-font-smoothing: antialiased;
  width: 390px; height: 844px; overflow: hidden; position: relative;
}
::selection { background: color-mix(in srgb, var(--work) 30%, transparent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--rule-strong) transparent; }
.scroll::-webkit-scrollbar { width: 4px; }
.scroll::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 2px; }
.ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }

/* ---- device chrome ---------------------------------------------------------------------- */
.status-bar { height: 47px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 7px 34px; font: 600 15px/1 var(--ui); color: var(--frame-ink); background: var(--frame); }
.status-bar .sys { display: flex; gap: 6px; align-items: center; }
.status-bar .sys svg { height: 12px; fill: currentColor; }
.app { position: absolute; inset: 47px 0 0 0; display: flex; flex-direction: column; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--ground); }
.screen.on { display: flex; animation: slide-in 260ms cubic-bezier(.16, 1, .3, 1); }
.screen.on.back { animation-name: slide-back; }
@keyframes slide-in { from { transform: translateX(14px); opacity: .6; } }
@keyframes slide-back { from { transform: translateX(-14px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .screen.on { animation: none; } }

/* ---- shell: the enamelled frame --------------------------------------------------------- */
.topbar { background: var(--frame); color: var(--frame-ink); padding: 6px 16px 12px; display: flex; align-items: center; gap: 10px; min-height: 52px; flex: none; }
.topbar h1 { font: 700 20px/1.15 var(--ui); margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.topbar h1 small { display: block; font: 500 12px/1.3 var(--ui); color: var(--frame-ink-2); letter-spacing: 0; margin-top: 2px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: inherit; margin: -6px; }
.icon-btn:active { background: var(--frame-2); }
.link-state { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--ui); color: var(--frame-ink-2); }
.link-state i { width: 7px; height: 7px; border-radius: 50%; background: #7fd3b8; }

.tabbar { flex: none; display: flex; background: var(--frame); color: var(--frame-ink-2); padding: 6px 8px 26px; border-top: 1px solid rgb(0 0 0 / .15); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 500 11px/1 var(--ui); padding: 6px 0; min-height: 48px; position: relative; }
.tabbar button[aria-current='page'] { color: var(--frame-ink); }
.tabbar button[aria-current='page']::before { content: ''; position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--frame-ink); }
.tabbar .count { position: absolute; top: 2px; left: calc(50% + 8px); font: 700 10px/16px var(--ui); min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--tab); color: var(--tab-ink); }

/* ---- shelf labels + rows (the pigeonholes) ---------------------------------------------- */
.shelf { margin: 18px 16px 6px; display: flex; align-items: baseline; gap: 8px; }
.shelf h2 { margin: 0; font: 700 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.shelf span { font: 400 12px/1 var(--label); color: var(--ink-3); }
.shelf .grow { flex: 1; }
.shelf a, .shelf button.more { font: 500 13px/1 var(--ui); color: var(--work); text-decoration: none; }

.slots { margin: 0 16px; background: var(--slot); border-radius: 14px; box-shadow: var(--shadow); }
.row { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; min-height: 64px; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--rule); }
.row:active { background: var(--slot-2); }
.row .title { font: 600 15px/1.25 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 2; font: 400 13px/1.3 var(--ui); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 400 12px/1 var(--ui); color: var(--ink-3); }
.row.needs { padding-right: 70px; }

/* designator: a brass label-holder plate, identical wherever the session appears */
.plate { grid-row: 1 / span 2; align-self: start; margin-top: 1px; font: 700 12px/1 var(--label); letter-spacing: .04em; color: var(--brass-ink); background: var(--brass); padding: 5px 6px 4px; border-radius: 3px; box-shadow: inset 0 -1px 0 rgb(0 0 0 / .18), inset 0 1px 0 rgb(255 255 255 / .35); white-space: nowrap; }
.plate.lg { font-size: 14px; padding: 6px 8px 5px; }

/* THE TAB — the signature move. A needs-you session pushes a vermilion index tab out past the
   right edge of its slot, so the right edge of any list is the queue. */
.tab { position: absolute; right: -7px; top: 50%; translate: 0 -50%; min-width: 58px; height: 26px; padding: 0 9px 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: var(--tab); color: var(--tab-ink); font: 700 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; border-radius: 6px 3px 3px 6px; box-shadow: 0 3px 8px -3px rgb(0 0 0 / .45); }
.tab::after { content: ''; position: absolute; right: 0; bottom: -4px; border: 2px solid transparent; border-top-color: color-mix(in srgb, var(--tab) 55%, #000); border-left-color: color-mix(in srgb, var(--tab) 55%, #000); }
.tab.done { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
.tab.done::after { display: none; }

/* state line: working = moving "in transit" stroke; duration rule length = time in state */
.state { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--ui); color: var(--ink-2); }
.state.working { color: var(--work); }
.state .dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid currentColor; }
.state.working .dot { border-right-color: transparent; animation: spin 1.1s linear infinite; }
.state.idle .dot { border-style: dashed; }
.state.asleep .dot { border-radius: 2px; }
@keyframes spin { to { rotate: 360deg; } }
.dur { grid-column: 2 / span 2; height: 10px; position: relative; margin-top: 2px; }
.dur::before { content: ''; position: absolute; left: 0; top: 4px; height: 2px; width: var(--w, 30%); background: var(--work); border-radius: 1px; }
.dur::after { content: ''; position: absolute; left: 0; right: 0; top: 5px; height: 0; border-top: 1px dotted var(--rule-strong); z-index: -1; }
.dur.stale::before { background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 5px); height: 4px; top: 3px; }

/* ---- chips, buttons --------------------------------------------------------------------- */
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; font: 600 15px/1 var(--ui); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--ink); color: var(--slot); }
.btn.answer { background: var(--tab); color: var(--tab-ink); }
.btn.quiet { background: var(--slot-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.block { width: 100%; }
.seg { display: flex; background: var(--frame-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 32px; border-radius: 8px; font: 600 13px/1 var(--ui); color: var(--frame-ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed='true'] { background: var(--frame-ink); color: var(--frame); }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; font: 500 14px/1 var(--ui); background: var(--slot); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed='true'] { background: var(--ink); color: var(--slot); box-shadow: none; }

/* ---- chat ------------------------------------------------------------------------------- */
.thread { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg-user { align-self: flex-end; max-width: 84%; background: var(--slot); padding: 10px 13px; border-radius: 16px 16px 4px 16px; box-shadow: inset 0 0 0 1px var(--rule); font-size: 15px; }
.msg-ai { font-size: 15px; line-height: 1.5; }
.msg-ai p { margin: 0 0 8px; }
.msg-ai code { font: 400 13px/1 var(--code); background: var(--slot-2); padding: 2px 5px; border-radius: 4px; }
.when { font: 400 12px/1 var(--ui); color: var(--ink-3); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { font: 400 12px/1 var(--code); color: var(--ink-2); background: var(--slot); box-shadow: inset 0 0 0 1px var(--rule); padding: 6px 8px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
.tool b { font-weight: 600; color: var(--ink); }

/* the answer surface: the only large vermilion-bordered thing on screen */
.ask { background: var(--slot); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 1.5px var(--tab); overflow: hidden; }
.ask header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; font: 700 11px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--tab); }
.ask h3 { margin: 6px 14px 4px; font: 700 17px/1.3 var(--ui); }
.ask .body { padding: 0 14px 4px; font-size: 14px; line-height: 1.5; color: var(--ink); }
.ask .body ol { margin: 6px 0; padding-left: 20px; }
.ask .body li { margin: 3px 0; }
.ask .body .cmd { font: 400 13px/1.45 var(--code); background: var(--term-bg); color: var(--term-ink); padding: 10px 12px; border-radius: 10px; margin: 8px 0; white-space: pre-wrap; }
.ask .actions { display: grid; gap: 8px; padding: 10px 14px 14px; }
.ask .actions.two { grid-template-columns: 1fr 1fr; }
.ask .opts { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 14px 4px; }
.ask .fade { position: relative; max-height: 132px; overflow: hidden; }
.ask .fade::after { content: ''; position: absolute; inset: auto 0 0; height: 40px; background: linear-gradient(transparent, var(--slot)); }
.ask.sent { box-shadow: var(--shadow), inset 0 0 0 1px var(--rule-strong); }
.ask.sent header { color: var(--ink-2); }

.working-row { display: flex; align-items: center; gap: 10px; font: 500 14px/1.3 var(--ui); color: var(--work); }

.composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px 30px; background: var(--ground); border-top: 1px solid var(--rule); }
.composer .field { flex: 1; min-height: 44px; border-radius: 22px; background: var(--slot); box-shadow: inset 0 0 0 1px var(--rule-strong); padding: 12px 16px; font: 400 15px/1.3 var(--ui); color: var(--ink-3); }
.composer .lock { flex: 1; min-height: 44px; display: flex; align-items: center; gap: 8px; font: 500 13px/1.3 var(--ui); color: var(--ink-2); padding: 0 6px; }
.composer .send { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--slot); display: grid; place-items: center; }
.composer .send[disabled] { opacity: .35; }

/* ---- terminal --------------------------------------------------------------------------- */
.term { flex: 1; background: var(--term-bg); color: var(--term-ink); font: 400 12px/1.42 var(--code); padding: 10px 10px 0; white-space: pre; overflow: hidden; }
.term .g { color: #7fd3b8; } .term .y { color: #e8c46a; } .term .r { color: #ff8a73; } .term .b { color: #8db7ff; } .term .d { color: #74857f; } .term .w { color: #fff; font-weight: 600; }
.term .cur { background: #d7e2dc; color: #0a0f0f; }
.keys { flex: none; display: flex; gap: 6px; padding: 8px 10px 30px; background: #0d1414; overflow-x: auto; }
.keys button { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 8px; background: #1f2b2a; color: #d7e2dc; font: 600 13px/1 var(--ui); flex: none; display: grid; place-items: center; }
.keys button.on { background: #d7e2dc; color: #0a0f0f; }

/* ---- board ------------------------------------------------------------------------------ */
.board { flex: 1; display: flex; gap: 12px; overflow-x: auto; padding: 14px 16px 16px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; }
.col { flex: none; width: 300px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; }
.col h3 { margin: 0 2px 2px; display: flex; align-items: center; gap: 8px; font: 700 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; }
.col h3 i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.col h3 span { color: var(--ink-3); font-weight: 400; }
.card { position: relative; background: var(--slot); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; text-align: left; }
.card .title { font: 600 14px/1.3 var(--ui); }
.card .sub { grid-column: 2; font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card.needs { padding-right: 68px; }
.label { font: 600 11px/1 var(--ui); padding: 4px 7px; border-radius: 5px; background: var(--slot-2); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink-2); }
.dots { display: flex; gap: 6px; justify-content: center; padding: 0 0 10px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-strong); }
.dots i.on { background: var(--ink); width: 18px; border-radius: 3px; }

/* ---- pairing ---------------------------------------------------------------------------- */
.pair { flex: 1; display: flex; flex-direction: column; padding: 28px 24px 34px; gap: 18px; }
.pair h2 { font: 700 28px/1.15 var(--ui); letter-spacing: -0.02em; margin: 0; }
.pair p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.5; }
.pair .grow { flex: 1; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--slot); border-radius: 14px; box-shadow: var(--shadow); }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 14px; font-size: 14px; line-height: 1.45; }
.steps li + li { border-top: 1px solid var(--rule); }
.steps li b { font: 700 13px/22px var(--label); color: var(--brass-ink); background: var(--brass); border-radius: 3px; text-align: center; height: 22px; }
.steps code { font: 400 12.5px/1.3 var(--code); background: var(--slot-2); padding: 2px 5px; border-radius: 4px; }
.viewfinder { aspect-ratio: 1; border-radius: 20px; background: #0a0f0f; position: relative; overflow: hidden; display: grid; place-items: center; }
.viewfinder .corners { position: absolute; inset: 16%; border: 3px solid transparent;
  background: linear-gradient(#7fd3b8, #7fd3b8) top left / 28px 3px no-repeat, linear-gradient(#7fd3b8, #7fd3b8) top left / 3px 28px no-repeat,
  linear-gradient(#7fd3b8, #7fd3b8) top right / 28px 3px no-repeat, linear-gradient(#7fd3b8, #7fd3b8) top right / 3px 28px no-repeat,
  linear-gradient(#7fd3b8, #7fd3b8) bottom left / 28px 3px no-repeat, linear-gradient(#7fd3b8, #7fd3b8) bottom left / 3px 28px no-repeat,
  linear-gradient(#7fd3b8, #7fd3b8) bottom right / 28px 3px no-repeat, linear-gradient(#7fd3b8, #7fd3b8) bottom right / 3px 28px no-repeat; }
.mac-card { background: var(--slot); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
.mac-card .k { grid-column: 2; font: 400 12px/1.4 var(--code); color: var(--ink-2); }
.sas { font: 700 38px/1 var(--code); letter-spacing: .02em; text-align: center; padding: 22px 8px; background: var(--slot); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 1.5px var(--brass); }
.sas span { color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-2); text-align: center; line-height: 1.45; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 10px; font: 500 14px/1 var(--ui); color: var(--work); }
.synthetic { position: absolute; left: 50%; translate: -50% 0; bottom: 6px; font: 500 11px/1 var(--ui); padding: 3px 8px; border-radius: 6px; background: var(--slot); color: var(--ink-2); white-space: nowrap; pointer-events: none; z-index: 20; }

/* Option B — the whole frame leads: every project shelf with its sessions, tabs on the right edge. */
.filters { background: var(--frame); padding: 0 16px 12px; flex: none; }
.filters .seg button span { font-variant-numeric: tabular-nums; opacity: .8; }
.rack-scroll { flex: 1; padding-bottom: 22px; }
.sess-head { flex-direction: column; align-items: stretch; gap: 10px; }
.sess-head .line { display: flex; align-items: center; gap: 10px; }
.mac-sheet { padding: 16px; display: grid; gap: 12px; align-content: start; }
.facts { background: var(--slot); border-radius: 14px; box-shadow: var(--shadow); }
.facts div { display: flex; justify-content: space-between; padding: 13px 14px; font-size: 14px; }
.facts div + div { border-top: 1px solid var(--rule); }
.facts dt { color: var(--ink-2); }
.facts code { font: 400 12.5px/1.3 var(--code); }
</style>
</head>

<div class="status-bar"><span class="tnum">9:41</span><span class="sys"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="1.5"/><rect x="24.5" y="4" width="1.8" height="4" rx=".9" opacity=".5"/></svg></span></div>
<div class="app" id="app"></div>

<script>
// Shared synthetic content + components for the three layout mockups. Nothing here is real data.
const I = {

  rack: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 14.5h18M12 4v16"/>',
  board: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  mac: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  send: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  term: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',

// A deterministic QR-shaped code for the viewfinder (finder patterns + seeded modules).
function qrSvg() {
  const n = 25, cells = []
  let x = 0x9e3779b9
  const rnd = () => ((x ^= x << 13), (x ^= x >>> 17), (x ^= x << 5), (x >>> 0) / 4294967296)
  const finder = (cx, cy, i, j) => i >= cx && i < cx + 7 && j >= cy && j < cy + 7
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const f = [[0, 0], [n - 7, 0], [0, n - 7]].find(([a, b]) => finder(a, b, i, j))
    let on
    if (f) { const u = i - f[0], v = j - f[1]; on = u === 0 || v === 0 || u === 6 || v === 6 || (u >= 2 && u <= 4 && v >= 2 && v <= 4) }
    else on = rnd() > 0.52
    if (on) cells.push(`<rect x="${i}" y="${j}" width="1.02" height="1.02"/>`)
  }
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" style="width:58%;background:#e9efe9;border-radius:6px" fill="#0a0f0f" aria-label="Pairing code">${cells.join('')}</svg>`
}

// ---- tiny router ---------------------------------------------------------------------------
function boot(home = 'home') {
  const root = document.documentElement
  const params = new URLSearchParams(location.search)
  const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
  root.dataset.theme = params.get('theme') || (prefersDark ? 'dark' : 'light')
  const paint = () => document.querySelectorAll('[data-theme-toggle]').forEach((b) => (b.innerHTML = ico(root.dataset.theme === 'dark' ? 'sun' : 'moon')))
  paint()
  const show = (id, back) => {
    const next = document.getElementById(id === 'home' ? home : id)
    if (!next) return
    document.querySelectorAll('.screen.on').forEach((s) => s.classList.remove('on', 'back'))
    next.classList.add('on'); if (back) next.classList.add('back')
    next.querySelectorAll('.board').forEach((b) => {
      const dots = b.nextElementSibling?.querySelectorAll('i') ?? []
      const sync = () => dots.forEach((d, i) => d.classList.toggle('on', i === Math.round(b.scrollLeft / 312)))
      b.onscroll = sync; if (!b.dataset.init) { b.dataset.init = '1'; b.scrollLeft = 312 } sync()
    })
    document.querySelectorAll('[data-nav]').forEach((b) => b.setAttribute('aria-current', b.dataset.go === id ? 'page' : 'false'))
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a'); if (!t) return
    if (t.hasAttribute('data-theme-toggle')) { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; paint(); return }
    if (t.hasAttribute('data-pick')) { t.parentElement.querySelectorAll('[data-pick]').forEach((c) => c.setAttribute('aria-pressed', String(c === t))); return }
    if (t.hasAttribute('data-answer')) {
      const card = t.closest('.ask'); card.classList.add('sent')
      card.querySelector('header').innerHTML = ico('check', 'sm') + 'Answered · agent is working'
      card.querySelectorAll('.actions, .opts').forEach((a) => (a.style.display = 'none')); return
    }
    if (t.hasAttribute('data-seg')) { t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t))) }
    if (t.dataset.go) show(t.dataset.go, t.hasAttribute('data-back'))
  })
  show(params.get('screen') || home)
}

      <div><dt>Notifications</dt><dd style="margin:0">Needs a Mac update</dd></div>
    </dl>
    <button class="btn quiet block" data-go="pair-1">Pair another Mac</button>
    <button class="btn quiet block">Forget ${MAC.name}</button>
  </div>${tabbar('mac')}
</section>
<section class="screen" id="chat">${sessionHead('chat')}
  <div class="scroll" style="flex:1">${THREAD}</div>
  <div class="composer"><div class="lock">${ico('lock', 'sm')}Answer the plan to continue.</div><button class="send" disabled aria-label="Send">${ico('send')}</button></div>
</section>
<section class="screen" id="term">${sessionHead('term')}
  <div class="term">${TERM}</div>${KEYS}
</section>
${PAIRING}`
boot()
</script>
</body>
</html>
