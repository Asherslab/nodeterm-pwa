# The Home Assistant add-on. Reference: https://developers.home-assistant.io/docs/add-ons/configuration
# Why it looks like this: README.md "Deploying" and docs/protocol.md (B1).

name: Ferry
description: A phone web app for your nodeterm desktop, reachable from anywhere through nodeterm's encrypted relay.
slug: ferry
url: https://github.com/Asherslab/nodeterm-pwa
# Written by CI (.github/workflows/docker-publish.yml) AFTER the image with this tag is pushed: that commit is
# what makes Home Assistant offer the update. Never edit by hand: a version with no image fails to install.
version: "0.0.3"
# One multi-arch image on GHCR, pulled by platform (no {arch} in the name). Building on the Pi starved other
# add-ons (Nginx Proxy Manager fell over during the first install), so it is never built there.
image: ghcr.io/asherslab/nodeterm-pwa-ferry
arch:
  - aarch64
  - amd64
startup: application
boot: auto

# Reached at its own HTTPS address through Nginx Proxy Manager (HTTPS only), so it can be installed on a
# phone. Not through Home Assistant's sidebar: an app inside HA's frame cannot be installed as a PWA.
# Nothing is published on the host unless a port is set on the Network tab.
ingress: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Only for a proxy on another machine. Leave empty for Nginx Proxy Manager on this Home Assistant.

# Least privilege, spelled out so an audit does not have to know the defaults: this add-on talks to
# Home Assistant about nothing, sees no host folder, device or network, and holds no secret.
homeassistant_api: false
hassio_api: false
auth_api: false
docker_api: false
host_network: false
host_pid: false
host_ipc: false
privileged: []
devices: []
map: []
full_access: false
apparmor: true

# Nothing to configure and nothing to back up: pairing state lives on the phone.
options: {}
schema: {}
backup: cold
