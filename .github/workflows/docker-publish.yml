# The whole release, the meal planner's pipeline: one push to main produces a version, one multi-arch image on
# GHCR, and a commit that tells Home Assistant there is an update. Nothing is built on the Pi.
name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Docs, design exploration and agent tooling are not releases: they would only cut a new version of the
    # same image.
    paths-ignore:
      - "docs/**"
      - "design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "**/*.md"

# One release at a time. Two overlapping runs would race to push the add-on version bump to main.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # GHCR names must be lower case.
  IMAGE: ghcr.io/asherslab/nodeterm-pwa-ferry

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-version reads the tag history; a shallow clone makes every run look like the first.
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0

      - name: Push Release Tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

  build:
    needs: version
    permissions:
      contents: read
      # GITHUB_TOKEN can push to this repository's own packages. No secret to create.
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The transport and server tests gate the release: a failing test never becomes an image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ferry/package-lock.json
      - name: Test
        working-directory: ferry
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No setup-qemu-action, on purpose: the build stage runs on the runner's platform and the final stage
      # only copies files (see ferry/Dockerfile).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ferry
          file: ferry/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline
          # Links the package to this repository, so it shows on the repo page.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ needs.version.outputs.version }}

  # Last, and only after the push succeeded: Home Assistant pulls exactly the tag config.yaml names, so a
  # version committed before its image exists fails to install.
  addon-version:
    needs: [ version, build ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the add-on version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" ferry/config.yaml
          grep -q "^version: \"${VERSION}\"$" ferry/config.yaml
          if git diff --quiet; then
            echo "config.yaml already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release add-on ${VERSION} [skip ci]"
          # A push to main since checkout would reject this; rebase onto it.
          git pull --rebase origin main
          git push origin HEAD:main
